# HTTP (ACME allowed) -> HTTPS
server {
  listen 80;
  listen [::]:80;

  server_name staging.evandroripka.dev;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/_letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name staging.evandroripka.dev;

  ssl_certificate /etc/letsencrypt/live/staging.evandroripka.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.evandroripka.dev/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/staging.evandroripka.dev/dist;
  index index.html;
  client_max_body_size 50M;

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /projetos {
    return 301 https://$host/#projects;
  }

  location = /admin {
    return 301 https://$host/my-panel$is_args$args;
  }

  location = /admin/login {
    return 301 https://$host/my-panel/login$is_args$args;
  }

  location ~ ^/projetos/(.+)$ {
    return 301 https://$host/projects/$1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2|mp4|webm|glb|gltf)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
